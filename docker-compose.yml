version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: servisync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: servisync
      POSTGRES_PASSWORD: servisync123
      POSTGRES_DB: servisync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servisync"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: servisync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
