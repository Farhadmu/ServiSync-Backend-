$kind: http-request
url: "{{baseUrl}}/work-orders/{{workOrderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{technicianToken}}
body:
  type: text
  content: |-
    {
      "status": "IN_PROGRESS"
    }
auth:
  type: bearer
  credentials:
    token: "{{technicianToken}}"
order: 4000
